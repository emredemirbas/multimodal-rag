name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/setup.cfg
      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend -m "not integration"

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: tutorial
          POSTGRES_USER: tutorial
          POSTGRES_PASSWORD: tutorial-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorial -d tutorial"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/setup.cfg
      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Run PostgreSQL integration tests
        env:
          PYTHONPATH: backend
          TEST_DATABASE_URL: postgresql://tutorial:tutorial-ci-password@localhost:5432/tutorial
        run: python -m pytest backend -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Verify pinned Next lint dependency compatibility
        run: npm run test:lint-compat
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
          DEVELOPMENT_AUTH_TOKEN: ci-development-token-not-for-production
        run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-integration, frontend]
    env:
      DEVELOPMENT_AUTH_TOKEN: ci-development-token-not-for-production
      POSTGRES_PASSWORD: tutorial-ci-password
      MINIO_ROOT_PASSWORD: tutorial-ci-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Verify shared nondefault playlist lease configuration
        run: >-
          PLAYLIST_CONCURRENCY=1 docker compose --profile local-asr config --format json |
          python3 -c 'import json,sys; services=json.load(sys.stdin)["services"];
          assert all(str(services[name]["environment"]["PLAYLIST_CONCURRENCY"]) == "1"
          for name in ("api", "scheduler", "ingestion-worker", "media-worker"));
          print("PASS: all playlist workers share the nondefault lease limit")'
      - name: Build deployable development images
        run: docker compose build api frontend ingestion-worker scheduler minio minio-permissions
      - name: Build optional ASR and media worker images without Whisper weights
        run: docker compose build asr media-worker
      - name: Verify ASR kernel isolation without model downloads
        run: >-
          docker compose --profile local-asr run --rm --no-deps --entrypoint python asr
          -c "from app.asr.isolation import block_outbound_sockets; block_outbound_sockets(); print('PASS: ASR outbound sockets blocked')"
      - name: Build optional local visual tool
        run: docker compose build visual-inspect visual-worker
      - name: Build optional local description worker without model downloads
        run: docker compose --profile local-ai --profile local-vision build description-worker
      - name: Verify local descriptions remain opt-in with a separate bounded worker
        run: >-
          docker compose --profile local-ai --profile local-vision config --format json |
          python3 -c 'import json,sys; c=json.load(sys.stdin); s=c["services"]["description-worker"];
          assert s["profiles"] == ["local-vision"] and s["read_only"] and not s.get("ports") and not s.get("volumes");
          assert str(s["environment"]["FRAME_DESCRIPTIONS_ENABLED"]).lower() == "false";
          assert not s["environment"]["VISION_MODEL_DIGEST"] and int(s["pids_limit"]) == 64;
          assert c["services"]["ollama"]["environment"]["OLLAMA_NO_CLOUD"] == "1";
          print("PASS: optional local description worker, no image weights bundled or pulled")'
      - name: Verify visual tool has no application mounts, credentials or network
        run: >-
          docker compose --profile visual-tools config --format json |
          python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]["visual-inspect"];
          assert s["network_mode"] == "none" and s["read_only"] and not s.get("ports")
          and not s.get("volumes") and not s.get("environment");
          assert int(s["pids_limit"]) == 32 and int(s["mem_limit"]) == int(s["memswap_limit"]) == 1073741824;
          print("PASS: standalone visual tool isolation configuration")'
      - name: Verify isolated native visual parsing and OCR diagnostics with authored cards
        run: >-
          docker compose --profile visual-tools run --rm -T --no-deps --entrypoint python
          visual-inspect -m app.vision.selftest
      - name: Compare isolated change candidates with actual uniform sampling
        run: >-
          docker compose --profile visual-tools run --rm -T --no-deps --entrypoint python
          visual-inspect -m app.vision.scene_selftest
      - name: Verify actual change-aware OCR and fractional-rate selected PTS
        run: >-
          docker compose --profile visual-tools run --rm -T --no-deps --entrypoint python
          visual-inspect -m app.vision.change_selftest
      - name: Measure both policies on fixed authored code and terminal probes
        run: >-
          docker compose --profile visual-tools run --rm -T --no-deps --entrypoint python
          visual-inspect -m app.vision.code_suite
      - name: Verify private visual service is opt-in and credential-free
        run: >-
          docker compose --profile local-visual config --format json |
          python3 -c 'import json,sys; c=json.load(sys.stdin); s=c["services"]["visual"];
          assert s["read_only"] and not s.get("ports") and not s.get("volumes") and not s.get("environment");
          assert s["profiles"] == ["local-visual"] and set(s["networks"]) == {"visual-private"};
          assert c["networks"]["visual-private"]["internal"];
          w=c["services"]["visual-worker"];
          assert set(w["networks"]) == {"default","visual-private"} and w["profiles"] == ["local-visual"];
          assert w["read_only"] and not w.get("ports") and not w.get("volumes");
          assert w["environment"]["VISUAL_BASE_URL"] == "http://visual:8091";
          assert all("visual-private" not in value.get("networks", {}) for name,value in c["services"].items() if name not in {"visual","visual-worker"});
          assert int(s["pids_limit"]) == 32 and int(s["mem_limit"]) == int(s["memswap_limit"]) == 1073741824;
          print("PASS: isolated private visual listener configuration")'
      - name: Verify trusted visual worker budgets and decoder separation
        run: >-
          docker compose --profile local-visual run --rm -T --no-deps --entrypoint python visual-worker
          -c "import shutil; from app.jobs.visual_worker import celery_app;
          assert celery_app.conf.task_time_limit == 210 and celery_app.conf.task_soft_time_limit == 180;
          assert celery_app.conf.broker_transport_options['visibility_timeout'] == 300;
          assert 'tutorial.process_video' in celery_app.tasks and 'tutorial.publish_visual' in celery_app.tasks;
          assert shutil.which('ffmpeg') is None and shutil.which('tesseract') is None;
          print('PASS: trusted visual worker budgets and no native decoders')"
      - name: Verify real private visual HTTP, profile pinning and native OCR
        run: >-
          docker compose --profile visual-tools run --rm -T --no-deps --entrypoint python
          visual-inspect -m app.vision.http_selftest
      - name: Start the complete development stack
        # Opt in only on this disposable stack, not normal/default startup.
        run: VIDEO_UPLOAD_ENABLED=true docker compose up -d --wait --wait-timeout 120
      - name: Verify optional visual service and worker actually become healthy
        run: VIDEO_UPLOAD_ENABLED=true docker compose --profile local-visual up -d --wait --wait-timeout 120 visual-worker
      - name: Exercise the Compose application
        run: |
          python3 scripts/smoke_sprint1.py
          python3 scripts/smoke_sprint2.py
          python3 scripts/smoke_sprint3.py
          python3 scripts/smoke_transcript_viewer.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integration dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Verify public MP4 boundary, native OCR, retention and 100 MB upload
        env:
          PYTHONPATH: backend
          VIDEO_WORKFLOW_SMOKE: "1"
          VIDEO_UPLOAD_SMOKE: "1"
          VIDEO_UPLOAD_LARGE_SMOKE: "1"
        run: >-
          docker compose --profile visual-tools run --rm -T --no-deps --entrypoint python
          visual-inspect -m app.vision.http_selftest --fixture |
          python scripts/smoke_video_workflow.py
      - name: Verify opt-in change-aware OCR through public upload and cited evidence
        env:
          PYTHONPATH: backend
          VIDEO_WORKFLOW_SMOKE: "1"
          VIDEO_UPLOAD_SMOKE: "1"
          VIDEO_CHANGE_SMOKE: "1"
        run: |
          VISUAL_SELECTION=change VIDEO_UPLOAD_ENABLED=true docker compose --profile local-visual up -d --no-deps --wait --wait-timeout 120 visual-worker
          docker compose --profile visual-tools run --rm -T --no-deps --entrypoint python visual-inspect -m app.vision.change_selftest --fixture | python scripts/smoke_video_workflow.py
          VISUAL_SELECTION=uniform VIDEO_UPLOAD_ENABLED=true docker compose --profile local-visual up -d --no-deps --wait --wait-timeout 120 visual-worker
      - name: Verify actual worker/checkpoint recovery, playlist slots and MinIO cleanup
        env:
          PYTHONPATH: backend
          TEST_REAL_WORKER: "1"
        run: python -m pytest backend -m integration --tb=short
      - name: Record synthetic retrieval regression measurements
        env:
          PYTHONPATH: backend
        run: python scripts/evaluate_rag.py --postgres
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop the CI stack
        if: always()
        run: docker compose --profile local-visual down --volumes --remove-orphans
