name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/setup.cfg
      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend -m "not integration"

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: tutorial
          POSTGRES_USER: tutorial
          POSTGRES_PASSWORD: tutorial-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorial -d tutorial"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/setup.cfg
      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Run PostgreSQL integration tests
        env:
          PYTHONPATH: backend
          TEST_DATABASE_URL: postgresql://tutorial:tutorial-ci-password@localhost:5432/tutorial
        run: python -m pytest backend -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Verify pinned Next lint dependency compatibility
        run: npm run test:lint-compat
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
          DEVELOPMENT_AUTH_TOKEN: ci-development-token-not-for-production
        run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-integration, frontend]
    env:
      DEVELOPMENT_AUTH_TOKEN: ci-development-token-not-for-production
      POSTGRES_PASSWORD: tutorial-ci-password
      MINIO_ROOT_PASSWORD: tutorial-ci-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build deployable development images
        run: docker compose build api frontend ingestion-worker scheduler minio minio-permissions
      - name: Build optional local ASR image without Whisper weights
        run: docker compose build asr
      - name: Verify ASR kernel isolation without model downloads
        run: >-
          docker compose --profile local-asr run --rm --no-deps --entrypoint python asr
          -c "from app.asr.isolation import block_outbound_sockets; block_outbound_sockets(); print('PASS: ASR outbound sockets blocked')"
      - name: Start the complete development stack
        run: docker compose up -d --wait --wait-timeout 120
      - name: Exercise the Compose application
        run: |
          python3 scripts/smoke_sprint1.py
          python3 scripts/smoke_sprint2.py
          python3 scripts/smoke_sprint3.py
          python3 scripts/smoke_transcript_viewer.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integration dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Verify actual worker/checkpoint recovery, playlist slots and MinIO cleanup
        env:
          PYTHONPATH: backend
          TEST_REAL_WORKER: "1"
        run: python -m pytest backend -m integration --tb=short
      - name: Record synthetic retrieval regression measurements
        env:
          PYTHONPATH: backend
        run: python scripts/evaluate_rag.py --postgres
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop the CI stack
        if: always()
        run: docker compose down --volumes
