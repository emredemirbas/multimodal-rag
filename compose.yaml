name: multimodal-tutorial-workspace

x-api-environment: &api-environment
  APP_ENV: development
  APP_STORE: postgres
  APP_AUTO_MIGRATE: "false"
  AUTH_MODE: development
  DEVELOPMENT_AUTH_TOKEN: ${DEVELOPMENT_AUTH_TOKEN:?set DEVELOPMENT_AUTH_TOKEN in .env}
  DATABASE_URL: postgresql://${POSTGRES_USER:-tutorial}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tutorial}
  EMBEDDING_DIMENSIONS: "64"
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
  LOG_LEVEL: INFO
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: tutorial-artifacts
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-tutorial}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  CELERY_BROKER_URL: redis://redis:6379/0
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  PLAYLIST_CONCURRENCY: ${PLAYLIST_CONCURRENCY:-2}
  ANSWER_PROVIDER: ${ANSWER_PROVIDER:-extractive}
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: qwen3:4b
  LOCAL_MODEL_TIMEOUT: "24"
  AUDIO_UPLOAD_ENABLED: ${AUDIO_UPLOAD_ENABLED:-false}
  VIDEO_UPLOAD_ENABLED: ${VIDEO_UPLOAD_ENABLED:-false}

x-api-image: &api-image
  build:
    context: ./backend

services:
  visual-worker:
    profiles: [local-visual]
    build:
      context: ./backend
      target: visual-worker
    environment:
      APP_ENV: development
      APP_STORE: postgres
      APP_AUTO_MIGRATE: "false"
      DEVELOPMENT_AUTH_TOKEN: visual-worker-is-not-an-api-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-tutorial}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tutorial}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: tutorial-artifacts
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-tutorial}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      CELERY_BROKER_URL: redis://redis:6379/0
      PLAYLIST_CONCURRENCY: ${PLAYLIST_CONCURRENCY:-2}
      VISUAL_BASE_URL: http://visual:8091
      VISUAL_SELECTION: ${VISUAL_SELECTION:-uniform}
    networks: [default, visual-private]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      visual:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "celery -A app.jobs.visual_worker:celery_app inspect ping --timeout=3 -d visual@$$HOSTNAME | grep -q pong"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  media-worker:
    profiles: [local-asr]
    build:
      context: ./backend
      target: media-worker
    environment:
      APP_ENV: development
      APP_STORE: postgres
      APP_AUTO_MIGRATE: "false"
      # Settings validation only; this trusted worker has no HTTP/auth endpoint.
      DEVELOPMENT_AUTH_TOKEN: media-worker-is-not-an-api-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-tutorial}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tutorial}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: tutorial-artifacts
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-tutorial}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      CELERY_BROKER_URL: redis://redis:6379/0
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      PLAYLIST_CONCURRENCY: ${PLAYLIST_CONCURRENCY:-2}
      ASR_BASE_URL: http://asr:8090
    networks: [default, asr-private]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      asr:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "celery -A app.jobs.media_worker:celery_app inspect ping --timeout=3 -d media@$$HOSTNAME | grep -q pong"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  visual:
    profiles: [local-visual]
    image: multimodal-tutorial-workspace-visual:local
    build:
      context: ./backend
      dockerfile: Dockerfile.vision
    entrypoint: [python, -m, app.vision.server]
    networks: [visual-private]
    read_only: true
    tmpfs:
      - /tmp:size=192m,mode=1777
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    pids_limit: 32
    ulimits:
      core: 0
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "from app.vision.client import LocalVisualClient; LocalVisualClient('http://127.0.0.1:8091').ready()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  visual-inspect:
    profiles: [visual-tools]
    image: multimodal-tutorial-workspace-visual:local
    build:
      context: ./backend
      dockerfile: Dockerfile.vision
    network_mode: none
    stdin_open: true
    read_only: true
    tmpfs:
      - /tmp:size=192m,mode=1777
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    pids_limit: 32
    ulimits:
      core: 0
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  asr:
    profiles: [local-asr]
    image: multimodal-tutorial-workspace-asr:local
    build:
      context: ./backend
      dockerfile: Dockerfile.asr
    networks: [asr-private]
    volumes:
      - asr-models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 64
    ulimits:
      core: 0
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/health/ready',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  asr-model-install:
    profiles: [asr-setup]
    image: multimodal-tutorial-workspace-asr:local
    build:
      context: ./backend
      dockerfile: Dockerfile.asr
    command: [python, -m, app.asr.install_model]
    volumes:
      - asr-models:/models
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "no"

  ollama:
    profiles: [local-ai]
    build:
      context: ./docker/ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models/weights
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
    volumes:
      - ollama_data:/models
    mem_limit: 6g
    cpus: 8.0
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  migrate:
    <<: *api-image
    command: ["python", "-m", "app.migrate"]
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    <<: *api-image
    environment:
      <<: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      # Multipart spooling must fit the gated 100 MB MP4 plus bounded overhead.
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  ingestion-worker:
    build:
      context: ./backend
      target: ingestion-worker
    environment:
      <<: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.jobs.worker:celery_app inspect ping --timeout=3 -d ingestion@$$HOSTNAME | grep -q pong"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  scheduler:
    <<: *api-image
    command: ["python", "-m", "app.jobs.scheduler"]
    environment:
      <<: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/ingestion-scheduler-heartbeat').st_mtime < 90"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
      DEVELOPMENT_AUTH_TOKEN: ${DEVELOPMENT_AUTH_TOKEN:?set DEVELOPMENT_AUTH_TOKEN in .env}
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutorial}
      POSTGRES_USER: ${POSTGRES_USER:-tutorial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tutorial} -d ${POSTGRES_DB:-tutorial}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    build:
      context: ./infra/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tutorial}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    depends_on:
      minio-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio-permissions:
    build:
      context: ./infra/minio
    user: "0:0"
    entrypoint: ["/bin/chown", "-R", "1000:1000", "/data"]
    volumes:
      - minio-data:/data
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE

volumes:
  asr-models:
  ollama_data:
  postgres-data:
  redis-data:
  minio-data:

networks:
  visual-private:
    internal: true
  asr-private:
    internal: true
