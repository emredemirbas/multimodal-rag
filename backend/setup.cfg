[metadata]
name = multimodal-tutorial-workspace
version = 0.9.0
description = Authenticated projects and asynchronous transcript ingestion

[options]
packages = find:
python_requires = >=3.10,<3.14
install_requires =
    fastapi>=0.115,<1
    pydantic>=2.10,<3
    psycopg[binary]>=3.2,<4
    uvicorn[standard]>=0.34,<1
    celery[redis]==5.6.3
    redis==6.4.0
    boto3==1.43.107
    python-multipart==0.0.22

[options.extras_require]
asr =
    faster-whisper==1.2.1
    ctranslate2==4.8.2
dev =
    httpx>=0.28,<1
    pytest>=8,<10

[options.packages.find]
where = .
include = app*

[options.package_data]
app =
    migrations/*.sql
