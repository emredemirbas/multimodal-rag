[metadata]
name = multimodal-tutorial-workspace
version = 0.1.0
description = Sprint 0 validation API for citation-backed tutorial learning

[options]
packages = find:
python_requires = >=3.10,<3.14
install_requires =
    fastapi>=0.115,<1
    pydantic>=2.10,<3
    psycopg[binary]>=3.2,<4
    uvicorn[standard]>=0.34,<1

[options.extras_require]
dev =
    httpx>=0.28,<1
    pytest>=8,<10

[options.packages.find]
where = .
include = app*

[options.package_data]
app =
    migrations/*.sql
