[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires external PostgreSQL with the pgvector extension",
    "worker_integration: requires Redis, MinIO and TEST_REAL_WORKER=1",
]
